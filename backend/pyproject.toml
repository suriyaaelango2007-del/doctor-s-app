[project]
name = "clinic-ai-backend"
version = "0.1.0"
description = "Clinic AI Intake — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "email-validator>=2.2",
    "phonenumbers>=8.13",
    "tzdata>=2024.1",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "time-machine>=2.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
